[package]
name = "ai-gateway-core"
version = "0.8.4"
edition = "2021"
description = "ai-gateway 核心逻辑（账号/切换/会话/签到/更新），不依赖 Tauri，可被桌面端与 HTTP server 复用"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# net/io-util 供 MITM 代理监听、TLS 与 accept 循环使用（device_proxy）
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
# 内嵌压缩后的 gateway.exe（单文件分发），运行时解压到缓存
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# CodeBuddy CN IDE Safe Storage (state.vscdb secret inject)
# aes/cbc/pbkdf2/sha1 供 macOS（Keychain→PBKDF2-SHA1→AES-128-CBC）与
# Linux（secret-tool→AES-128-CBC）分支使用；Windows 分支只用 aes-gcm。
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
# Trae 账号设备指纹的确定性派生（SHA-256 级联）+ 豆包对话导出的 UUID 生成
sha2 = "0.10"
# URL 编解码：豆包 multi_sids / sid_guard 解析、OAuth 回调地址编码
urlencoding = "2"
# 豆包对话导出走官方 IM API，需要随机指纹字段
rand = "0.8"

# device_proxy（MITM 设备身份代理）：hyper 1.x 协议栈自建
# —— 为什么不用 hudsucker：其非拦截 CONNECT 隧道硬编码直连，无法透传用户 VPN 上游。
# flate2 另用于抓包日志 gzip/deflate 解压与 WS permessage-deflate 尽力解压。
hyper = { version = "1", features = ["client", "server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "server", "server-auto", "http1", "tokio", "service"] }
# 刻意关掉默认特性里的 aws_lc_rs，改用 ring：
# 本仓库其余部分（reqwest 的 rustls-tls）已经是 ring 后端，若此处再引入 aws-lc-rs，
# 会同时激活两个 CryptoProvider 并额外拉入 aws-lc-sys（需 cmake/nasm，本机没有，
# 会直接编译失败）。ring 与 reqwest 保持一致，也避免构建期 C 工具链依赖。
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
# 注：上游 Cargo.toml 里的 hyper-rustls / futures-util / tokio-stream 是给其他模块用的，
# device_proxy 一行都没引用（客户端 TLS 走 tokio-rustls + webpki-roots 直连），
# 故此处不引入，避免留下无人使用的依赖。
# 自签 CA 与按域名即时签发叶子证书（私钥不落盘）
rcgen = { version = "0.14", features = ["x509-parser"] }
time = "0.3"
# upstream.rs：UpstreamConnector 实现 tower::Service<Uri>（hyper legacy Client 连接器接口）
tower-service = "0.3"
webpki-roots = "0.26"
bytes = "1"
# 脱敏正则（体级凭证键值掩码）与本地登录态扫描
regex = "1"

[target.'cfg(windows)'.dependencies]
# Win32_System_JobObjects / Win32_System_Threading / Win32_Security 供网关子进程的
# Job Object 孤儿防护使用（应用退出时连带终止 gateway.exe）。
# Win32_Security_Cryptography 供 DPAPI（豆包 cookie 解密诊断、保险库主密码保护）。
# Win32_UI_WindowsAndMessaging 供 request_graceful_close 的 EnumWindows/PostMessageW。
# Win32_UI_Shell 供 .lnk 快捷方式解析回退。
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# 注册表读写：HKLM MachineGuid 重置、Uninstall 键枚举定位 exe。
windows-registry = "0.6"

[build-dependencies]
# 构建期压缩内嵌网关
flate2 = "1"
