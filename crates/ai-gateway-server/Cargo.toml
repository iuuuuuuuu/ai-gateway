[package]
name = "ai-gateway-server"
version = "1.0.3"
edition = "2021"
description = "ai-gateway HTTP server + CLI（npm 安装形态：ai-gateway 命令启动本地 webui）"

[[bin]]
name = "ai-gateway"
path = "src/main.rs"

[dependencies]
ai-gateway-core = { path = "../ai-gateway-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
rust-embed = "8"
