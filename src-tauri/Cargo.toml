[package]
name = "ai-gateway"
version = "1.0.8"
description = "ai-gateway —— WorkBuddy 账号切换工具（Rust/Tauri 版）"
authors = ["apple"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_gateway_lib"
# 桌面版只需 rlib（iOS 用 staticlib）。
#
# 刻意去掉 cdylib：它是 Android 需要的产物类型，会让 GNU 链接器尝试导出
# 全部符号，而 MinGW 的导出序号上限是 65535 —— 加入依赖后实测达到 161178，
# 报「export ordinal too large」链接失败。桌面构建不需要 cdylib。
# 若将来要出 Android 版，请改用 MSVC 工具链并把 cdylib 加回。
crate-type = ["staticlib", "rlib"]

[features]
# 默认启用 custom-protocol：不开该 feature 的 `cargo build --release` 会产出加载
# devUrl http://localhost:1420 的开发模式 exe，vite 未运行时窗口即报
# “localhost 拒绝连接”。`tauri dev` 传 --no-default-features 并过滤本 feature，
# `tauri build` 显式传 tauri/custom-protocol，两者均不受影响。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
ai-gateway-core = { path = "../crates/ai-gateway-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# ZCode 验证码求解服务（captcha_webview）：本地 HTTP 服务收网关的求解请求。
#
# hyper 的版本与 features 与 `crates/ai-gateway-core` 的 device_proxy 保持一致 ——
# 两处各写一份版本号迟早会分叉，而 hyper 的 0.x/1.x 之间 API 不兼容。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
url = "2"
# 单实例保护：多开会并发写 accounts.json 并重复启停网关
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.2"

# 系统自启（开机静默启动）：仅桌面目标支持（macOS / Windows / Linux）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# macOS Dock 图标与「隐藏而非退出」行为所需的 AppKit 绑定。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
