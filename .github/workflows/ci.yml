name: ci

# push / PR 的编译校验：三个平台各跑一遍类型检查、单测与全 workspace 编译。
# 发版见 release.yml（打 v* tag 触发）。
#
# 这里刻意不构建 Go 网关、也不打安装包 —— 只回答「还能不能编译、测试过不过」，
# 让问题在 push 阶段暴露，而不是等到发版当天。
# 三平台都跑是重点：历史上出现过多次「只在某一个平台编译失败」的回归
# （例如 macOS 专用的 Dock 图标代码打断 Windows 构建）。
#
# ⚠ 2026-10-01：网关已从 Go 全量重写为 Rust（crates/ai-gateway-router），
# 故 `gateway` 这一路不再需要 setup-go，改为对**Rust 网关**跑单测与构建。
# Go 源码 go-gateway/ 仍保留作对照参考，但已不参与构建。

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # v* 交给 release.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: 前端类型检查与构建
        run: npm run build

      - name: 核心单测
        run: cargo test -p ai-gateway-core

      # --profile test 不可省：cargo test 默认在 `test` profile 下构建（继承 dev，
      # 但 debug-assertions / overflow-checks 与 dev 不同，产物因此不通用），而
      # cargo check 默认用 `dev`。不加这一条，ai-gateway-core 会在同一个 job 里被
      # 完整编译两遍 —— Windows 上实测第二遍要付 19–21s，而 windows-latest 正是
      # ci 的关键路径，这 20s 直接进墙钟。
      #
      # --all-targets 会把测试代码也编一遍，所以平台门控写错（少一个 cfg）在这里就会红。
      - name: 全 workspace 编译校验
        run: cargo check --workspace --all-targets --profile test

      # Intel Mac（x86_64-apple-darwin）的编译门控。
      #
      # 以前这层覆盖由 release.yml 的 macos-15-intel 那一腿提供，但它是整个发布
      # 的关键路径（892s，比第二慢的 windows-x64 707s 还多 3 分钟），已从发布矩阵
      # 摘掉。摘掉后 Intel 目标就没有任何地方做编译校验了 —— 上面那条
      # cargo check --workspace 只编 arm64。这里把它补回来：交叉检查比跑一整个
      # Intel runner + 完整 release 构建便宜得多，门控强度却一样。
      - name: Intel Mac 编译校验（x86_64-apple-darwin）
        if: runner.os == 'macOS'
        run: cargo check --workspace --all-targets --target x86_64-apple-darwin

  gateway:
    name: gateway / Rust 单测与构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 网关源码随仓库分发（Rust 版，crates/ai-gateway-router），
      # 这里验证单测与构建链路。
      #
      # ⚠ 不再需要 actions/setup-go：2026-10-01 起网关是 Rust 的。
      # 旧版这里还带 `cache-dependency-path: go-gateway/go.sum`，那是为了
      # 让 setup-go 的缓存生效（它默认找**仓库根**的 go.sum，而本仓库的
      # go.mod/go.sum 在 go-gateway/ 下）。整条 setup-go 一起去掉。
      - name: 网关单测
        run: cargo test -p ai-gateway-router --lib

      # ★ 宿主 WebUI 服务端（npm 分发的那个 `ai-gateway` 命令）的单测。
      #
      # 为什么必须单独加这一条：它此前**从未在 CI 里跑过** —— 而这里住着一条
      # 「前端 ROUTES ↔ 服务端路由」的一致性测试
      # （`api.rs::every_frontend_route_path_has_a_server_handler`），
      # 它正是用来抓「前端登记了路由、服务端没实现」这个**反复出现**的缺陷类
      # （webui 下点了 404，而桌面端走 Tauri IPC 看不出来 ⇒ 桌面端测试全覆盖不到）。
      # 2026-10-01 我据此查出并修好 4 条真实缺口：`/api/proxy/test-upstream`、
      # `/api/proxy/probe-nodes`、`/api/gateway/sms/send`、`/api/gateway/sms/verify`。
      #
      # ⚠ 不加这条的话，那个测试**永远不会被执行** —— 写了等于没写。
      - name: 宿主 WebUI 服务端单测
        run: cargo test -p ai-gateway-server

      # 走真正的构建入口，而不是 `cargo build -p … --bin gateway`：
      # 这样 CI 验证的是**打包时实际执行的那条路径**（含产物后缀判定、
      # CARGO_TARGET_DIR 归一、1 MB 阈值校验），而不是一条平行的近似命令。
      # 历史上「脚本能跑但 CI 用的是另一条命令」正是回归能溜过去的原因。
      - name: 构建网关
        run: sh scripts/build-gateway.sh

  # 这一路补上 build.yml 被摘掉 tag 触发后失去的覆盖：
  # `cargo build -p ai-gateway-server --release`（**release 二进制**，不是 cargo
  # check）全仓库只有它跑过。
  #
  # 为什么值得单独一个 job：release profile 与 check/test profile 的产物不通用，
  # 而且只有 release 构建才会暴露 LTO / 优化期才炸的错误（例如死代码消除触发的
  # 借用检查、#[cfg] 组合在优化后失效）。release.yml 里虽然也会构建，但那是在
  # tag 之后 —— 那时候发现问题已经晚了。
  #
  # 只跑 linux 一个平台：这里要的是「release 模式能不能编出来」，跨平台门控由
  # 上面的 check 矩阵负责，在 Windows/macOS 上再跑一遍 release 纯属重复烧时间。
  release-bin:
    name: release 二进制编译校验
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # build.rs 会把网关二进制 gzip 后编进主程序，缺了它这一步会报
      # 「本构建未内嵌网关二进制」—— 所以必须先产出网关。
      # 也必须先有 dist/：ai-gateway-server 用 RustEmbed 嵌入 ../../dist。
      - name: 构建内嵌网关
        run: sh scripts/build-gateway.sh

      - run: npm ci

      - name: 构建前端
        run: npm run build

      - name: release 二进制编译
        run: cargo build -p ai-gateway-server --release
