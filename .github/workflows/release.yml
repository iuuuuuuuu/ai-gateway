name: release

# 打 v* tag（或手动触发）时构建全部平台并发布 GitHub Release。
#
# 关于签名与自动更新：
#   tauri.conf.json 里 createUpdaterArtifacts=true，产物带 .sig，并生成
#   latest.json 供应用内「检查更新」使用（endpoints 指向 releases/latest/download/）。
#
#   因此本工作流**必须**注入签名私钥，否则三个平台都会在「构建桌面应用」失败。
#   仓库 secrets 需要配好这两个（缺任意一个都会失败）：
#     TAURI_SIGNING_PRIVATE_KEY          私钥内容（不是路径！传路径会报
#                                        Invalid symbol 58，因为路径里有冒号）
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥口令
#   本地同一把密钥位于 %USERPROFILE%\.ai-gateway\ai-gateway-updater.key，
#   本地构建走 scripts/build-signed.ps1（详见 AGENTS.md「构建与签名」）。
#
#   注意：minisign 私钥与平台无关，一把密钥即可签所有平台，不存在
#   「只配了 Windows 用的密钥」这回事 —— 历史上 macOS 任务失败的真实原因是
#   secrets 里根本没有配置私钥，而不是密钥不适用于 macOS。
#
#   仍待处理：gen-update-json.sh 目前只支持 Windows，macOS/Linux 只上传 .sig，
#   不生成各自的 latest-<os>-<arch>.json（Windows 是主力分发平台，够用）。
#
# macOS 产物为 adhoc 签名（无 Apple 开发者证书），用户首次打开会提示「已损坏」，
# 需执行 `xattr -cr "/Applications/AI Gateway.app"` 放行。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发版前的快速验证门。
  #
  # 背景：本工作流此前**没有任何测试** —— 没有 cargo test、没有 cargo check、
  # 没有 go test，唯一的校验是产物断言（.sig 数量、安装包存在性）。也就是说，
  # 一个 tag 完全可以为「从未通过编译校验与单测」的代码发布安装包，而且发布
  # 一旦出去就撤不回来。这一点在 push 阶段由 ci.yml 覆盖，但打 tag 时并不强制
  # 要求 ci 绿 —— tag 可以打在任意 commit 上。
  #
  # 为什么不直接塞进下面四个平台 job：那会把同样的检查重复跑 4 遍，而 windows
  # 那条关键路径已经很贵（707s）。这里用**一个** ubuntu job 做门控，四平台
  # 必须等它通过才开跑，代价只有 ~2 分钟，换来「发布出去的必定测过」。
  #
  # 用 needs 而非 continue-on-error：这里就是要它**能拦住**发布，与下面
  # build 的"单平台失败不阻断其余平台"是相反的策略，两者互不冲突。
  preflight:
    name: preflight / 发版前验证
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go-gateway/go.sum

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # build.rs 内嵌网关、ai-gateway-server 的 RustEmbed 内嵌 dist/，
      # 两者都必须在 cargo 之前就位，否则编译会以「未内嵌」或找不到目录失败。
      - name: 构建内嵌网关
        run: sh scripts/build-gateway.sh

      - name: 构建前端
        run: npm run build

      - name: 核心单测
        run: cargo test -p ai-gateway-core

      - name: 全 workspace 编译校验
        run: cargo check --workspace --all-targets --profile test

      - name: Go 网关单测
        working-directory: go-gateway
        run: go test ./...

  build:
    name: build / ${{ matrix.name }}
    needs: preflight
    # 单平台失败不阻断其余平台，也不阻断 Release。
    #
    # 注意这里有两层，缺一不可：
    #   1. continue-on-error 只保证「本 job 失败不把整个 run 判为失败」；
    #   2. release job 必须配合 !cancelled() 才会在 build 失败时照常执行 ——
    #      因为 needs: build 默认要求依赖成功，否则 release 会被直接 skip。
    # 只加 continue-on-error 而不改 release 的 if，仍然会出现「一个平台挂了、
    # 整个 Release 一个资产都发不出来」的情况（v0.7.1 就是这样）。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # ⚠ 这里**保持静态** nsis,msi —— 不要在 matrix 里写 `${{ }}` 表达式。
            #
            # 预发布版本要跳过 msi（原因见下面「解析打包目标」那步的长注释），
            # 但 matrix 值里的表达式是否能求值**没有把握**（GitHub 的上下文
            # 可用性表里 `jobs.<job_id>.strategy` 只列了 github/needs/vars/inputs，
            # 而这类不确定的东西一旦不成立，表现是 `--bundles` 收到一整个
            # `${{ ... }}` 字面量 ⇒ 构建直接失败）。
            # 用运行时计算就没有这个不确定性：run 步骤里的表达式求值
            # 是本仓库已经在用的、确定可行的路径。
            bundles: nsis,msi
            goos: windows
            goarch: amd64
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app
            goos: darwin
            goarch: arm64
            arch_label: aarch64
          # Intel Mac（x86_64-apple-darwin）—— 2026-09-22 **加回**。
          #
          # 移除时的理由是墙钟：它是关键路径（892s），四腿并行时另外三个平台
          # 全程空等它，发布被拖到 15m21s。当时也**不影响自动更新**，因为
          # 那份清单只处理 Windows。
          #
          # 现在两条前提都变了：
          #   1. 所有者要求 mac 的 **Intel 与 M1 都能收到自动更新** ——
          #      而 updater 的清单键是按 arch 分的（darwin-x86_64 vs
          #      darwin-aarch64），没有这一腿就**必然**缺 Intel 的键，
          #      Intel 机器点「检查更新」会报错。
          #   2. 墙钟不再是问题：release 任务用 needs + !cancelled()，
          #      某一腿慢只是让总时长等于最慢那腿，不会让其它平台白等
          #      产物发布（各腿各自 upload-artifact，最后统一发布）。
          #
          # ⚠ runner label 必须是 **macos-15-intel**：macos-13 已下线，
          # 而 macos-14 现在是 arm64 —— 写错会静默跑到 arm64 上，
          # 编出 aarch64 的产物冒充 Intel 包（比构建失败更糟）。
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
            goos: darwin
            goarch: amd64
            arch_label: x86_64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 不要在此加 `key:` —— Swatinem/rust-cache 的 `key` 是**追加**在自动生成的
      # key 之后，不是替代。自动 key 已含 OS + target triple，再加 matrix.target
      # 只会把同一份依赖缓存按平台切碎、多存几份。
      #
      # 后果是实测过的：仓库缓存一度冲到 10.43 GB / 10 GB（97%），触发 LRU 驱逐，
      # 反过来把 ci.yml 的 v0-rust-check-* 缓存挤掉，逼出冷编译（最差 438s，
      # 是均值 148s 的 3 倍）。
      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # dmgbuild 直接写 Finder 元数据而不启动 Finder，所以无头 CI 里
      # DMG 也能保留大图标与拖拽箭头（Tauri 自带的 bundle_dmg.sh 在 CI 里不稳定，
      # 本项目一直用 scripts/make-dmg.sh 代替）。
      - name: 安装 dmgbuild
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install --quiet \
            --disable-pip-version-check "dmgbuild==1.6.7"
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"

      # portable.zip 用 Python 打包：文件名含中文（使用说明.txt），
      # zipfile 写 UTF-8 名称标志位比 compress-archive/zip 更可靠。
      - name: 准备 Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 同 ci.yml：不指 cache-dependency-path 的话 setup-go 会去找仓库根的
      # go.sum（不存在），缓存形同虚设，每次都要重新编译整个 stdlib。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go-gateway/go.sum

      - name: 解析版本号
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # 手动触发时没有 tag，退回 Cargo.toml 里的版本
          if ! printf '%s' "$VER" | grep -qE '^[0-9]'; then
            VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "版本号: $VER"

      # 必须在前端与 Rust 构建之前：build.rs 会把网关 gzip 后编进主程序，
      # 缺了它应用能起来但网关功能会报「本构建未内嵌网关二进制」。
      - name: 构建内嵌网关（Go）
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: sh scripts/build-gateway.sh

      - run: npm ci

      - name: 构建前端
        run: npm run build

      # 必须注入签名私钥：createUpdaterArtifacts=true 时 Tauri 对**每个**平台
      # 都要求私钥，缺失即失败（v0.7.1/v0.7.2 就是这样三平台全挂、Release 被跳过的）。
      # 私钥与平台无关，同一把密钥签所有平台。
      - name: 构建桌面应用
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 私钥缺失时立刻给出可读原因，而不是让 Tauri 报晦涩的解码错误。
          # 注意 secrets 在 if 条件里不可直接引用，所以这里用 env 判断。
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "错误：未配置仓库 secret TAURI_SIGNING_PRIVATE_KEY。" >&2
            echo "  设置：gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.ai-gateway/ai-gateway-updater.key" >&2
            echo "  说明见 AGENTS.md「构建与签名」。" >&2
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "错误：未配置仓库 secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD。" >&2
            echo "  设置：gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2
            exit 1
          fi
          # ⚠⚠ 预发布版本必须把 msi 从打包目标里去掉（2026-09-23 实测踩到）。
          #
          # v1.0.9-beta.1 这一版 Windows 腿直接失败，报的是：
          #
          #	failed to bundle project: `optional pre-release identifier in
          #	app version must be numeric-only and cannot be greater than
          #	65535 for msi target`
          #
          # MSI 的 ProductVersion 规范只允许 `major.minor.build` 三段**数字**，
          # 预发布段只能是数字（如 `1.0.9-1`）。`beta` 这种字母标识 MSI
          # 根本不接受 —— 那是 MSI 格式自身的限制，改 Tauri 配置绕不过去。
          #
          # NSIS 没这个约束（它用字符串版本号），所以预发布时**只出 nsis**：
          # 安装包照样能装，自动更新照样能用（updater 走的就是 nsis 的
          # `windows-x86_64-nsis` 键，见 gen-update-json.sh 的 PLATFORM_KEYS）。
          #
          # ⚠ 为什么在 run 里算、而不是把表达式写进 matrix：
          # matrix 值里能否用 GitHub 的表达式语法（dollar 紧跟两个花括号）
          # 没有把握 —— 一旦不求值，--bundles 会收到那一串字面量而直接失败。
          # 而 run 步骤里的表达式求值是本仓库已在用的确定路径。
          #
          # ⚠ 这段注释里**绝不能**写出那个花括号字面量：
          # 本块是 YAML 的 run 块标量，其中的 # 是 **shell 注释而非 YAML 注释**，
          # 所以块内任何花括号表达式都会被 GitHub 真的当表达式去求值 ——
          # 空表达式会让整份 workflow 在解析阶段被拒绝，表现为
          # 「run 创建即失败、零 job、workflow 名字回退成文件路径」，
          # 而 PyYAML / 编辑器都不会报错。本地用 actionlint 可复现。
          #
          # 判据与 release 任务的 prerelease 标记**同源**（版本号含连字符），
          # 避免两处口径不一致。
          BUNDLES="${{ matrix.bundles }}"
          case "${{ github.ref_name }}" in
            *-*)
              case "$BUNDLES" in
                *msi*)
                  BUNDLES=$(printf '%s' "$BUNDLES" | sed 's/,msi//; s/msi,//; s/msi//')
                  echo "预发布版本（${{ github.ref_name }}）：已从打包目标去掉 msi（MSI 不接受非数字预发布标识）"
                  ;;
              esac
              ;;
          esac
          echo "打包目标：$BUNDLES"

          # cargo 缓存会把上一版的安装包一起带出来，不清理就会混进 Release
          rm -rf "target/${{ matrix.target }}/release/bundle"
          npm run tauri -- build \
            --target ${{ matrix.target }} \
            --bundles "$BUNDLES"
          echo "bundle 内容:"
          find "target/${{ matrix.target }}/release/bundle" -type f | sort || true
          # 断言签名确实产出：少了 .sig 客户端就无法更新，必须在这里拦住。
          # 用计数而非 `find | grep -q`：前者结果确定、且失败时能打印数量便于排查。
          SIG_COUNT=$(find "target/${{ matrix.target }}/release/bundle" -type f -name '*.sig' | wc -l | tr -d ' ')
          if [ "$SIG_COUNT" -eq 0 ]; then
            echo "错误：构建完成但没有生成任何 .sig，签名未生效。" >&2
            exit 1
          fi
          echo "签名文件数：$SIG_COUNT"

      - name: 定位 bundle 目录
        shell: bash
        run: |
          set -euo pipefail
          # 工作区在仓库根，但历史上也出现过 src-tauri/target；两处都认。
          for base in target src-tauri/target; do
            d="$base/${{ matrix.target }}/release/bundle"
            if [ -d "$d" ]; then
              echo "BUNDLE_ROOT=$d" >> "$GITHUB_ENV"
              echo "bundle 目录: $d"
              exit 0
            fi
          done
          echo "未找到 bundle 目录" >&2
          exit 1

      - name: 打包 macOS（校验主程序 + adhoc 签名 + dmg）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app" >&2
            ls -la "$BUNDLE_ROOT/macos" >&2 || true
            exit 1
          fi

          # 前端资源（frontendDist）会被**编进主程序二进制**，不在 Contents/Resources/
          # 下 —— Resources 只放 bundle.resources 显式列出的文件（本仓库是
          # WebView2Loader.dll）与图标。所以不要去断言 Resources/dist，
          # 它本来就不该存在（按官方文档：路径形式的 frontendDist 一律嵌入二进制）。
          # 这里只校验主程序存在且体积合理，用来发现构建残缺。
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "未找到主程序" >&2
            ls -la "$APP/Contents/MacOS" >&2 || true
            exit 1
          fi
          SIZE=$(wc -c < "$BIN" | tr -d ' ')
          if [ "$SIZE" -lt 1048576 ]; then
            echo "主程序体积异常（$SIZE 字节），疑似构建不完整" >&2
            exit 1
          fi
          echo "主程序: $BIN ($((SIZE / 1048576)) MB)"

          # 无开发者证书，adhoc 签名；否则 Apple Silicon 上可能拒绝启动
          codesign --force --deep --sign - "$APP"
          sh scripts/make-dmg.sh "$APP_VERSION" "${{ matrix.arch_label }}" "$APP"
          mkdir -p dist-bin
          cp "ai-gateway_${APP_VERSION}_${{ matrix.arch_label }}.dmg" dist-bin/
          # ⚠ 自动更新需要 **.app.tar.gz + .sig**（不是 .dmg）。
          #
          # `createUpdaterArtifacts=true` 会让 tauri 额外产出一个
          # `*.app.tar.gz` 与其 `.sig` —— 那是 updater 真正下载并替换的东西；
          # .dmg 只供用户手动安装，updater **不认识**它。
          #
          # 此前只收集 .dmg，于是 macOS 客户端「检查更新」必然失败：
          # 清单里没有 darwin-* 条目，也没有可供下载的包。
          APP_TGZ=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -1)
          if [ -z "$APP_TGZ" ]; then
            echo "未找到 .app.tar.gz（updater 包）—— macOS 自动更新会失效" >&2
            ls -la "$BUNDLE_ROOT/macos" >&2 || true
            exit 1
          fi
          if [ ! -f "$APP_TGZ.sig" ]; then
            echo "未找到 $APP_TGZ.sig —— 签名未生效，updater 会拒绝该包" >&2
            exit 1
          fi
          echo "updater 包: $APP_TGZ"
          cp "$APP_TGZ" dist-bin/
          cp "$APP_TGZ.sig" dist-bin/

      - name: 打包 Windows（portable.zip）
        if: runner.os == 'Windows'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${{ matrix.target }}/release"
          [ -d "$RELEASE_DIR" ] || RELEASE_DIR="src-tauri/target/${{ matrix.target }}/release"

          COUNT=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "预期 release 目录下有 1 个主程序 exe，实际 $COUNT 个:" >&2
            find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.exe' >&2 || true
            exit 1
          fi
          EXE=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.exe')

          mkdir -p dist-bin
          STAGE=$(mktemp -d)
          cp "$EXE" "$STAGE/app.exe"
          cp src-tauri/WebView2Loader.dll "$STAGE/WebView2Loader.dll"

          # 免安装版说明：仓库里放了 release/使用说明.txt 就用它（逐字照搬，
          # 方便按版本手写更新日志），否则生成一份简短说明。
          NOTES="release/使用说明.txt"
          [ -f "$NOTES" ] || NOTES=""

          python - "$STAGE" "dist-bin/AI_Gateway_${APP_VERSION}_portable.zip" "$NOTES" "$APP_VERSION" <<'PY'
          import pathlib, sys, zipfile

          stage, out, notes, ver = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]

          if notes:
              readme = pathlib.Path(notes).read_text(encoding="utf-8")
          else:
              readme = f"""AI Gateway {ver} —— 免安装版

          【运行】双击 AI-Gateway.exe
             WebView2Loader.dll 必须与 exe 同目录，请勿删除

          【依赖】需系统已装 WebView2 Runtime（Win10/11 一般自带）

          详细说明见仓库 README.md。
          """

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.write(stage / "app.exe", "AI-Gateway.exe")
              z.write(stage / "WebView2Loader.dll", "WebView2Loader.dll")
              z.writestr("使用说明.txt", readme)
          print(f"已生成 {out}")
          PY

      # 安装包（NSIS setup.exe + MSI）与上面的 portable.zip 是两回事，各自收集。
      # 首次发版就漏了这一步，只发出了 portable.zip —— 所以这里对数量做硬断言。
      - name: 收集 Windows 安装包
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          for spec in "nsis:*-setup.exe" "msi:*.msi"; do
            sub="${spec%%:*}"; glob="${spec#*:}"
            COUNT=$(find "$BUNDLE_ROOT/$sub" -maxdepth 1 -type f -name "$glob" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$COUNT" != "1" ]; then
              echo "预期 $BUNDLE_ROOT/$sub 下恰好 1 个 $glob，实际 $COUNT 个" >&2
              ls -la "$BUNDLE_ROOT/$sub" >&2 || true
              exit 1
            fi
            find "$BUNDLE_ROOT/$sub" -maxdepth 1 -type f -name "$glob" -exec cp {} dist-bin/ \;
            # ⚠ 配套的 .sig 必须**在这里**一起收进来，不能等后面的
            # 「生成 updater 清单」步去拷：那一步在「检查产物齐全」断言**之后**，
            # 而断言要求 dist-bin 下恰好 1 个 *-setup.exe.sig。
            # 于是正式版 Windows 腿会稳定挂在断言上（v1.0.9 实测踩到），
            # 并连带把 upload-artifact 整步 skip 掉 —— Release 里一个 Windows
            # 资产都没有，比构建失败更隐蔽。
            find "$BUNDLE_ROOT/$sub" -maxdepth 1 -type f -name "$glob.sig" -exec cp {} dist-bin/ \;
          done

      - name: 收集 Linux 产物
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist-bin/ \;

          # ⚠⚠ 自动更新用的是**裸 .AppImage + .AppImage.sig**（2026-09-23 定论）。
          #
          # # 我第一版写错了，这里是更正后的结论
          #
          # 原实现断言必须存在 `*.AppImage.tar.gz`，并因此让 Linux 腿**直接失败**：
          #
          #	未找到 AppImage 的 .tar.gz（updater 包）—— Linux 自动更新会失效
          #
          # 那个断言基于一句**过时的文档**：`tauri-plugin-updater` 的
          # `updater.rs:962` 注释写着 "AppImage.tar.gz # GZ generated by
          # tauri-bundler"。但对照 Tauri 的实际源码，`.tar.gz` **只在
          # `createUpdaterArtifacts: "v1Compatible"`（v1 兼容模式）下才生成**：
          #
          #	crates/tauri-bundler/src/bundle.rs
          #	  if updater.v1_compatible {
          #	      matches!(package_type, AppImage | MacOsBundle | Nsis | Msi | Deb)
          #	  } else {
          #	      matches!(package_type, MacOsBundle)   // ← v2 只有 macOS 打包
          #	  }
          #
          # 本项目配置是 `createUpdaterArtifacts: true`（v2 模式）⇒
          # Linux **不产** .tar.gz，只签名裸 .AppImage。
          # 这也正好解释了为什么 macOS 有 `.app.tar.gz (updater)` 而 Linux 没有，
          # 以及 CI 日志里 "Finished 2 updater signatures" 列的是
          # `deb.sig` 与 `AppImage.sig`。
          #
          # # 裸 .AppImage 够不够用：够
          #
          # `tauri-plugin-updater` 的 `install_appimage` 对非 gzip 的输入
          # 直接 `std::fs::write` 覆盖当前 AppImage（AppImage 是 ELF，
          # `infer::archive::is_gz()` 判 false，所以走的就是这条）：
          #
          #	#[cfg(feature = "zip")]
          #	if infer::archive::is_gz(bytes) { ...解包... }
          #	log::debug!("rewriting AppImage");
          #	std::fs::write(&self.extract_path, bytes)
          #
          # 官方文档（v2.tauri.app/plugin/updater 的 v2 标签页）也是这么写的：
          # 「myapp.AppImage — The standard app bundle. **It will be re-used by
          #   the updater.**」+ `myapp.AppImage.sig`。
          # 官方 `tauri-action` 的 `signaturePriority()` 同样把
          # `.AppImage.sig` 排在最优先（返回 100）。
          #
          # 故这里收集裸 AppImage 与其 .sig；`.AppImage.tar.gz` 若将来
          # 真出现了（切到 v1Compatible）也会被一并收走 —— 用 `-o` 两种都匹配。
          APPIMG=$(find "$BUNDLE_ROOT" -type f -name '*.AppImage' ! -name '*.tar.gz' | head -1)
          if [ -z "$APPIMG" ]; then
            echo "未找到 .AppImage（updater 包）—— Linux 自动更新会失效" >&2
            find "$BUNDLE_ROOT" -type f -name '*.AppImage*' >&2 || true
            exit 1
          fi
          if [ ! -f "$APPIMG.sig" ]; then
            echo "未找到 $APPIMG.sig —— 签名未生效，updater 会拒绝该包" >&2
            exit 1
          fi
          echo "updater 包: $APPIMG"
          cp "$APPIMG" dist-bin/
          cp "$APPIMG.sig" dist-bin/

      # 按平台断言应有的产物，而不是只看「非空」——
      # 只看非空的话，Windows 漏掉 exe/msi 只剩 portable.zip 也能混过去。
      #
      # 这一步必须在「生成 updater 清单」**之前**：清单步骤会往 dist-bin 里
      # 额外放一份固定名副本（同样是 *-setup.exe），放在后面会让下面的
      # 「恰好 1 个 *-setup.exe」断言数出 2 个而误报失败。
      - name: 检查产物齐全
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist-bin
          case "${{ runner.os }}" in
            # ⚠ 每条都要求 **updater 包**（.sig / .tar.gz）在场 ——
            # 只断言"有安装包"是不够的：那正是本仓库此前的状态
            #（Windows 有 .sig、macOS/Linux 没有 updater 包），
            # 表现为"只有 Windows 能自动更新"，而 CI 全绿。
            #
            # ⚠ Windows 的 *.msi **只在正式版**存在：预发布版本会跳过 MSI
            #（MSI 不接受非数字预发布标识，见「构建桌面应用」那步的注释）。
            # 所以这里按版本号是否含连字符决定要不要断言 msi ——
            # 若不判断，预发布版会在这一步报「预期恰好 1 个 *.msi，实际 0 个」。
            Windows)
              if printf '%s' "$APP_VERSION" | grep -q -- '-'; then
                expect="*-setup.exe *_portable.zip *-setup.exe.sig"
                echo "预发布版本（$APP_VERSION）：跳过 *.msi 断言（MSI 不接受非数字预发布标识）"
              else
                expect="*-setup.exe *.msi *_portable.zip *-setup.exe.sig"
              fi
              ;;
            macOS)   expect="*.dmg *.app.tar.gz *.app.tar.gz.sig" ;;
            Linux)   expect="*.deb *.AppImage *.AppImage.sig" ;;
          esac
          for glob in $expect; do
            n=$(find dist-bin -maxdepth 1 -type f -name "$glob" | wc -l | tr -d ' ')
            if [ "$n" != "1" ]; then
              echo "预期 dist-bin 下恰好 1 个 $glob，实际 $n 个" >&2
              exit 1
            fi
          done

      # 生成 updater 清单。自动更新要求「固定 URL」，而安装包名里带版本号，
      # 所以这里额外复制一份固定名副本，清单指向固定名。
      #
      # 关键：重命名后**不需要**重新签名。已实测验证（pynacl 对真实产物验签）：
      # minisign 验签只覆盖文件内容，签名里 trusted comment 的 file: 字段
      # 不参与校验 —— 用「AI Gateway_0.7.0_x64-setup.exe」签出的
      # .sig，能验过重命名成 ai-gateway-windows-x86_64-setup.exe 的同一文件。
      # （scripts/publish-release.sh 头部注释里"必须重新签名"的说法是错的。）
      - name: 生成 updater 清单
        if: runner.os == 'Windows'
        shell: bash
        env:
          UPDATE_OS: windows
          UPDATE_ARCH: x86_64
          UPDATE_ARCHIVE_NAME: ai-gateway-windows-x86_64-setup.exe
        run: |
          set -euo pipefail
          VER="$APP_VERSION"
          # 安装包文件名含空格（productName 是 "AI Gateway"），
          # 先断言命中数为 1，避免多个匹配时静默取到错误的那一个。
          MATCHES=$(find "$BUNDLE_ROOT/nsis" -maxdepth 1 -type f -name "*_${VER}_x64-setup.exe" | wc -l | tr -d ' ')
          if [ "$MATCHES" != "1" ]; then
            echo "错误：预期恰好 1 个 ${VER} 的 NSIS 安装包，实际 $MATCHES 个" >&2
            ls -la "$BUNDLE_ROOT/nsis" >&2 || true
            exit 1
          fi
          ARCHIVE=$(find "$BUNDLE_ROOT/nsis" -maxdepth 1 -type f -name "*_${VER}_x64-setup.exe")
          if [ ! -f "$ARCHIVE.sig" ]; then
            echo "错误：安装包没有配套 .sig，签名未生效：$ARCHIVE.sig" >&2
            exit 1
          fi
          cp "$ARCHIVE" "dist-bin/$UPDATE_ARCHIVE_NAME"
          cp "$ARCHIVE.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
          UPDATE_VERSION="$VER" BUNDLE_DIR="$BUNDLE_ROOT/nsis" sh scripts/gen-update-json.sh
          MANIFEST="$BUNDLE_ROOT/nsis/latest-${UPDATE_OS}-${UPDATE_ARCH}.json"
          test -f "$MANIFEST"
          cp "$MANIFEST" dist-bin/
          # 断言清单里的 URL 与签名都已写入，避免生成出空壳清单。
          # 不用 grep -q：它静默失败会让人看不出是"清单不对"还是"步骤本身挂了"。
          if ! grep -q "$UPDATE_ARCHIVE_NAME" "$MANIFEST"; then
            echo "错误：清单里没有指向 $UPDATE_ARCHIVE_NAME 的 URL" >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          if ! grep -q '"signature"' "$MANIFEST"; then
            echo "错误：清单里缺少 signature 字段" >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          echo "updater 清单已生成："
          cat "$MANIFEST"

      # ---- macOS / Linux 的 updater 清单（2026-09-22 新增）----
      #
      # 此前只有 Windows 会生成 `latest-<os>-<arch>.json`，于是
      # `latest.json` 里**只有 windows-* 两个键**，mac / linux 客户端
      # 「检查更新」时找不到自己平台的条目 → 报错。
      #
      # ⚠ 各平台的 updater 包：
      #   macOS → `*.app.tar.gz`（.dmg 只是手动安装用）
      #   Linux → **裸 `*.AppImage`**（v2 模式下不产 .tar.gz，见「收集 Linux
      #           产物」那步的长注释；updater 会直接覆盖当前 AppImage）
      # 清单必须指向 updater 真正会下载的那个文件。
      #
      # URL 用 `releases/latest/download/<固定名>`：自动更新要求 URL 固定，
      # 而产物名里带版本号，所以先复制一份固定名再生成清单。
      - name: 生成 updater 清单（macOS）
        if: runner.os == 'macOS'
        shell: bash
        env:
          UPDATE_OS: darwin
          UPDATE_ARCH: ${{ matrix.arch_label }}
          UPDATE_ARCHIVE_NAME: ai-gateway-macos-${{ matrix.arch_label }}.app.tar.gz
        run: |
          set -euo pipefail
          SRC=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -1)
          if [ -z "$SRC" ]; then
            echo "错误：未找到 .app.tar.gz" >&2
            ls -la "$BUNDLE_ROOT/macos" >&2 || true
            exit 1
          fi
          cp "$SRC" "dist-bin/$UPDATE_ARCHIVE_NAME"
          cp "$SRC.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
          UPDATE_VERSION="$APP_VERSION" BUNDLE_DIR="$BUNDLE_ROOT/macos" sh scripts/gen-update-json.sh
          MANIFEST="$BUNDLE_ROOT/macos/latest-${UPDATE_OS}-${UPDATE_ARCH}.json"
          test -f "$MANIFEST"
          cp "$MANIFEST" dist-bin/
          if ! grep -q "$UPDATE_ARCHIVE_NAME" "$MANIFEST"; then
            echo "错误：清单里没有指向 $UPDATE_ARCHIVE_NAME 的 URL" >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          if ! grep -q '"signature"' "$MANIFEST"; then
            echo "错误：清单里缺少 signature 字段" >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          echo "updater 清单已生成："
          cat "$MANIFEST"

      - name: 生成 updater 清单（Linux）
        if: runner.os == 'Linux'
        shell: bash
        env:
          UPDATE_OS: linux
          UPDATE_ARCH: x86_64
          # ⚠ 固定名用 **.AppImage**（不带 .tar.gz）—— 清单里的 URL 必须指向
          # updater 真正会下载的那个文件，而 v2 模式下产的就是裸 AppImage。
          UPDATE_ARCHIVE_NAME: ai-gateway-linux-x86_64.AppImage
        run: |
          set -euo pipefail
          SRC=$(find "$BUNDLE_ROOT" -type f -name '*.AppImage' ! -name '*.tar.gz' | head -1)
          if [ -z "$SRC" ]; then
            echo "错误：未找到 .AppImage" >&2
            find "$BUNDLE_ROOT" -type f -name '*.AppImage*' >&2 || true
            exit 1
          fi
          cp "$SRC" "dist-bin/$UPDATE_ARCHIVE_NAME"
          cp "$SRC.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
          UPDATE_VERSION="$APP_VERSION" BUNDLE_DIR="$(dirname "$SRC")" sh scripts/gen-update-json.sh
          MANIFEST="$(dirname "$SRC")/latest-${UPDATE_OS}-${UPDATE_ARCH}.json"
          test -f "$MANIFEST"
          cp "$MANIFEST" dist-bin/
          if ! grep -q "$UPDATE_ARCHIVE_NAME" "$MANIFEST"; then
            echo "错误：清单里没有指向 $UPDATE_ARCHIVE_NAME 的 URL" >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          if ! grep -q '"signature"' "$MANIFEST"; then
            echo "错误：清单里缺少 signature 字段" >&2
            cat "$MANIFEST" >&2
            exit 1
          fi
          echo "updater 清单已生成："
          cat "$MANIFEST"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [preflight, build]
    # 手动触发没有 tag，不建 Release（只留在 Artifacts 里供下载验证）
    #
    # !cancelled() 不可省略：needs: build 默认要求依赖成功，只要有一个平台
    # 失败（continue-on-error 不会把结果改成 success），release 就会被 skip。
    # 加上它之后，只要不是被主动取消，Windows 等成功的平台产物照常发布。
    #
    # 前半段 needs.preflight.result == 'success' 是必须的：`build` 的 needs 是
    # preflight，preflight 一挂 build 就会被 skip，而 !cancelled() 对「被 skip」
    # 是 true —— 于是 release 会照常执行、却一个产物都没有，merge-update-manifests.py
    # 拿空目录去跑，轻则报错重则发一个空 Release。
    # 这正是「发版前验证」要防的情况：测试挂了就宁可什么都不发。
    #
    # 注意不能写成 needs: build 就够了 —— build 被 skip 时其 result 也是 skipped，
    # 而这里要区分的是「build 跑过但某些平台失败」（照常发）与「build 压根没跑」
    # （不能发），所以必须同时看 preflight。
    if: ${{ !cancelled() && needs.preflight.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布资产
        run: ls -la artifacts

      # 把各平台的 latest-<os>-<arch>.json 合并成 latest.json ——
      # tauri.conf.json 的 endpoints 第一项就是 releases/latest/download/latest.json，
      # 缺了它应用内「检查更新」会 404。
      - name: 合并 updater 清单
        run: python3 scripts/merge-update-manifests.py artifacts

      # 发布说明优先用仓库里手写的 .github/RELEASE_NOTES_<版本>.md（能写清「为什么」
      # 和升级注意事项），没有就回退到 GitHub 自动生成的提交列表。
      #
      # 这两步过去都是手工的：流水线把 Release 建成 draft，再由人工
      # `gh release edit --notes-file ...` 补说明并发布。只要有人忘了点，Release
      # 就一直是 draft —— 而 draft 不参与 releases/latest/ 解析，自动更新直接 404
      # （v1.0.0 与 v1.0.1 都出现过，两次都得手工补）。
      #
      # body_path 指向不存在的文件时该 action 只告警并回退到 body，不会失败；
      # 这里仍显式判断，避免每次发布都刷一条无意义的告警。
      - name: 解析发布说明
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME 在 tag 触发时形如 v1.0.1，去掉前缀 v 得到版本号。
          p=".github/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$p" ]; then
            echo "path=$p" >> "$GITHUB_OUTPUT"
            echo "使用手写发布说明：$p"
          else
            echo "未找到 $p，改用自动生成的提交列表"
          fi

      # draft: false —— 直接发布。
      #
      # 历史上这里是 true（担心 macOS 没跑通，想先人工核对）。但 draft 的
      # Release **不参与 releases/latest/ 解析**，于是自动更新端点会 404，
      # 必须有人手动点 Publish 客户端才能收到更新。
      #
      # 产物本身已有足够防护，不需要靠 draft 兜底：build 任务对每个平台的
      # 产物做了数量断言、对 .sig 存在性做了硬校验，release 任务又用
      # needs + !cancelled() 保证「某平台失败不影响其余平台照常发布」。
      # ⚠⚠ 重跑同一个 tag 时，**必须**先删掉已有的 Release（2026-09-22）。
      #
      # 实测：`softprops/action-gh-release@v2` 对**已存在**的 Release
      # **不会覆盖正文** —— 它的文档写着
      # 「When the release info keys are not explicitly set and there is already
      #   an existing release, the release will retain its original info.」
      # 于是「改了 RELEASE_NOTES_*.md → 重打 tag → 修复说明」这条自救路径
      # **静默失效**：workflow 全绿、日志没有任何异常，而 Release 页面上
      # 挂的还是上一次的正文。我第一次重打 tag 就撞上了这个。
      #
      # 先删后建是让它用新正文的唯一可靠办法。删掉的只是 Release 记录，
      # **tag 本身不受影响**（下一个 tag 仍能正常创建），资产随后重建。
      - name: 删除该 tag 已有的 Release（让正文能被重新写入）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "已存在 $GITHUB_REF_NAME 的 Release，先删除以便重写正文"
            gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false
          else
            echo "$GITHUB_REF_NAME 尚无 Release，直接创建"
          fi

      # ⚠⚠ 判别是不是**预发布测试版**（2026-09-23 新增）。
      #
      # # 为什么这一步很关键
      #
      # 客户端的 updater 端点是
      # `.../releases/latest/download/latest.json`，而 GitHub 的
      # `releases/latest` **会跳过 prerelease**（它只指向最新的非预发布版）。
      #
      # 所以：**只要把测试版标成 prerelease，正式版用户就不会被自动推到它上面**；
      # 反之若标成普通 Release，测试版会立刻成为 `latest` ——
      # 所有装了 1.0.8 的人下次启动就会被更新到一个 beta。
      #
      # 判据用**版本号里有没有连字符**（语义化版本的预发布段就是
      # `1.0.9-beta.1` 这种形式）。这也与 npm / Go 模块的通行约定一致。
      - name: 判断是否为预发布（版本号含连字符）
        id: prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # 去掉前缀 v，只看版本号部分
          ver="${tag#v}"
          # 只取第一个连字符之前的"核心版本"，后面有内容即为预发布
          core="${ver%%-*}"
          if [ "$core" != "$ver" ]; then
            echo "is=true" >> "$GITHUB_OUTPUT"
            echo "检测到预发布版本（$tag）：将标记为 prerelease，不进入 latest 通道"
          else
            echo "is=false" >> "$GITHUB_OUTPUT"
            echo "正式版本（$tag）：正常发布，进入 latest 通道"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          # ⚠ 见上一步：预发布**必须**标记，否则它会变成 releases/latest
          # 而把正式版用户推到测试版上。
          prerelease: ${{ steps.prerelease.outputs.is == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          # 有手写说明时**不要**再 prepend 自动生成的提交列表 ——
          # 那会把 "What's Changed" 堆在正文顶部，与手写内容重复
          #（v1.0.7 的正文就只有那段自动摘要，83 字符）。
          # 只在**没有**手写说明（path 为空）时才用它兜底。
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
